<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Waitlist — ARSH</title>
  <meta name="description" content="Join the ARSH waitlist. Early access to the first collection opens on 15 December. Only 25 pieces of each design, never to be reproduced.">
  <meta name="theme-color" content="#F23B35">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/brand/wordmark.svg" as="image" type="image/svg+xml" crossorigin>
  <link rel="preload" href="/assets/fonts/BootzyCondensedTM-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="/assets/fonts/fallback/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/shop.css">
  <link rel="stylesheet" href="/css/waitlist.css">
</head>
<body class="waitlist-page">
  <!-- The wax seal: a hand-pressed blob and its ring. Same artwork as assets/brand/wax-seal.svg. -->

    <symbol id="seal-art" viewBox="0 0 200 200">

      <path d="M189.3 100.0 C189.8 108.1 186.8 116.9 183.9 124.6 C181.0 132.3 176.5 139.5 171.8 146.2 C167.2 152.8 162.0 159.4 155.9 164.5 C149.8 169.6 142.5 173.9 135.2 177.0 C127.9 180.2 119.8 182.9 112.0 183.6 C104.2 184.3 96.3 182.1 88.3 181.0 C80.4 180.0 72.4 179.8 64.6 177.5 C56.8 175.3 47.9 172.5 41.4 167.6 C35.0 162.6 29.5 155.0 25.7 147.8 C21.8 140.5 19.4 131.9 18.3 124.0 C17.2 116.0 18.8 107.9 19.1 100.0 C19.4 92.1 19.0 84.5 20.2 76.6 C21.3 68.6 21.8 59.1 25.9 52.4 C30.0 45.7 38.5 41.6 44.9 36.4 C51.2 31.2 56.9 25.1 64.0 21.3 C71.2 17.4 79.4 15.1 87.5 13.4 C95.7 11.6 104.7 9.5 112.8 10.8 C120.9 12.0 129.5 16.2 136.1 20.9 C142.8 25.5 147.0 33.4 152.9 38.9 C158.8 44.5 166.8 47.9 171.5 54.1 C176.1 60.3 177.8 68.6 180.7 76.3 C183.7 84.0 188.7 91.9 189.3 100.0 Z" fill="rgba(255,255,255,.09)" transform="translate(-4 -4) scale(.96) translate(4 4)"/>
      <circle cx="100" cy="100" r="64" fill="none" stroke="rgba(13,13,13,.32)" stroke-width="3"/>
      <circle cx="100" cy="100" r="58.5" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
    </symbol>
  </svg>

  <header class="header" data-theme="dark">
    <a class="header__home" href="/waitlist" aria-label="ARSH"><span class="mark" aria-hidden="true"></span></a>
  </header>

  <main class="waitlist" id="main">
    <section class="waitlist__pitch" aria-labelledby="wl-title">
      <span class="waitlist__galaxy mark" aria-hidden="true"></span>
      <div class="waitlist__sign">
        <span class="lockup"><span class="wordmark" role="img" aria-label="Arsh"></span><span class="mark" aria-hidden="true"></span></span>
      </div>
      <div class="waitlist__copy">
        <p class="eyebrow ui" data-copy="waitlist.eyebrow">Request access</p>
        <h1 class="waitlist__title display" id="wl-title" data-copy="waitlist.title">Opens by invitation.</h1>
        <p class="waitlist__lede" data-copy="waitlist.lede"></p>
        <div class="countdown" id="countdown" hidden>
          <p class="countdown__label ui" id="cd-label" data-copy="waitlist.countdownLabel"></p>
          <div class="countdown__grid" role="timer" aria-labelledby="cd-label">
            <div><b id="cd-d">00</b><span data-copy="waitlist.days">Days</span></div>
            <div><b id="cd-h">00</b><span data-copy="waitlist.hours">Hours</span></div>
            <div><b id="cd-m">00</b><span data-copy="waitlist.minutes">Minutes</span></div>
            <div><b id="cd-s">00</b><span data-copy="waitlist.seconds">Seconds</span></div>
          </div>
        </div>
      </div>
      <p class="waitlist__tag ui" data-copy="waitlist.tag"></p>
    </section>

    <section class="waitlist__panel" id="wl-panel">
      <div class="waitlist__stage" id="wl-stage">

        <!-- The envelope (script reveals it; without script, or with reduced motion, the letter is simply there) -->
        <div class="envelope" id="envelope" hidden>
          <p class="envelope__hint ui" id="env-hint" data-copy="waitlist.hint">Break the seal</p>
          <div class="envelope__scene">
            <div class="env__back" aria-hidden="true"></div>
            <div class="env__letter" aria-hidden="true">
              <span class="wordmark"></span>
              <span class="env__rules"><i></i><i></i><i></i><i></i></span>
            </div>
            <div class="env__front" aria-hidden="true"></div>
            <svg class="env__folds" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <path d="M0 0 L50 56 L100 0 M0 100 L50 56 L100 100" />
            </svg>
            <div class="env__flap" aria-hidden="true"><span class="flap__out"></span><span class="flap__in"></span></div>
            <button type="button" class="seal" id="seal" data-copy-attr="aria-label:waitlist.sealLabel" aria-label="Break the wax seal to open the envelope">
              <span class="seal__half seal__half--l" aria-hidden="true"><svg class="seal__art" viewBox="0 0 200 200"><use href="#seal-art"/></svg><span class="wordmark seal__word"></span></span>
              <span class="seal__half seal__half--r" aria-hidden="true"><svg class="seal__art" viewBox="0 0 200 200"><use href="#seal-art"/></svg><span class="wordmark seal__word"></span></span>
            </button>
          </div>
        </div>

        <!-- The letter: the real form -->
        <form class="letter waitlist__form" id="wl-form" novalidate aria-labelledby="wl-letter-title" tabindex="-1">
          <div class="letter__head">
            <span class="wordmark" role="img" aria-label="Arsh"></span>
            <span class="mark" aria-hidden="true"></span>
          </div>
          <h2 class="letter__title ui" id="wl-letter-title" data-copy="waitlist.letterTitle">Request access</h2>
          <div class="fields">
            <div class="field field--full"><label for="wl-name" data-copy="waitlist.name">Name</label><input id="wl-name" name="name" autocomplete="name" maxlength="120" required></div>
            <div class="field field--full"><label for="wl-email" data-copy="waitlist.email">Email address</label><input id="wl-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="200" required></div>
            <div class="field"><label for="wl-phone" data-copy="waitlist.phone">WhatsApp or phone</label><input id="wl-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+92 3xx xxxxxxx" maxlength="30"></div>
            <div class="field"><label for="wl-city" data-copy="waitlist.city">City</label><input id="wl-city" name="city" autocomplete="address-level2" maxlength="80"></div>
            <div class="field"><label for="wl-interest" data-copy="waitlist.interest">Interested in</label><select id="wl-interest" name="productId"></select></div>
            <div class="field"><label for="wl-size" data-copy="waitlist.size">Size</label><select id="wl-size" name="size"></select></div>
            <div class="field field--full"><label for="wl-heard" data-copy="waitlist.heard">How did you hear about us?</label><select id="wl-heard" name="heardFrom"></select></div>
          </div>
          <input type="text" name="company" tabindex="-1" autocomplete="off" class="wl-hp" aria-hidden="true">
          <label class="consent"><input type="checkbox" name="consent" id="wl-consent" required><span data-copy="waitlist.consent"></span></label>
          <button class="button" type="submit" id="wl-submit" data-copy="waitlist.button">Join the waitlist</button>
          <p class="form-status ui" id="wl-status" role="status" aria-live="polite"></p>
        </form>

        <div class="waitlist__done" id="wl-done" hidden></div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/waitlist.js"></script>
</body>
</html>
